<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>
  <style>
    :root {
      --bg-window: #1c1c1e;
      --bg-sidebar: #252528;
      --bg-editor: #1e1e20;
      --bg-elevated: #2c2c2f;
      --border: #38383c;
      --text-primary: #f5f5f7;
      --text-secondary: #98989f;
      --accent: #f5b400;
      --accent-hover: #ffca28;
      --danger: #ff453a;
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0d0f;
      color: var(--text-primary);
      font-family: var(--font-apple);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .notes-app {
      width: 100%;
      max-width: 920px;
      height: 600px;
      background: var(--bg-window);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: grid;
      grid-template-columns: 290px 1fr;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .new-note-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .new-note-btn:hover {
      background: rgba(245, 180, 0, 0.12);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .note-item {
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
    }

    .note-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .note-item.active {
      background: var(--accent);
      color: #141416;
    }

    .note-item-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-sub {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .note-item.active .note-item-sub {
      color: rgba(20, 20, 22, 0.75);
    }

    /* Editor */
    .editor {
      background: var(--bg-editor);
      display: flex;
      flex-direction: column;
      padding: 18px 24px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
      gap: 10px;
    }

    .status-text {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-save {
      background: var(--accent);
      color: #141416;
    }

    .btn-save:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-delete {
      background: var(--bg-elevated);
      color: var(--danger);
      border: 1px solid var(--border);
    }

    .btn-delete:hover:not(:disabled) {
      background: rgba(255, 69, 58, 0.14);
    }

    .note-textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text-primary);
      font-family: var(--font-apple);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .note-textarea::placeholder {
      color: var(--text-secondary);
    }

    #note {
      display: none;
    }

    @media (max-width: 700px) {
      .notes-app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 85vh;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="notes-app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Notes</h1>
        <button class="new-note-btn" id="new-note-btn" title="New Note">✎</button>
      </div>
      <div class="notes-list" id="notes-list"></div>
    </aside>

    <main class="editor">
      <div class="toolbar">
        <span class="status-text" id="status-text">Ready</span>
        <div class="toolbar-actions">
          <button class="btn btn-delete" id="delete-btn" disabled>Delete</button>
          <button class="btn btn-save" id="save-btn">Save</button>
        </div>
      </div>

      <textarea
        class="note-textarea"
        id="note-input"
        placeholder="Start typing a note..."
      ></textarea>

      <div id="note"></div>
    </main>
  </div>

  <script>
    const BASE_URL = "http://localhost:3000";
    const NOTES_URL = `${BASE_URL}/notes`;

    const notesListEl = document.getElementById("notes-list");
    const noteInputEl = document.getElementById("note-input");
    const newNoteBtn = document.getElementById("new-note-btn");
    const saveBtn = document.getElementById("save-btn");
    const deleteBtn = document.getElementById("delete-btn");
    const statusTextEl = document.getElementById("status-text");
    const rawNoteDiv = document.getElementById("note");

    let notes = [];
    let selectedId = null;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderSidebar() {
      notesListEl.innerHTML = "";

      if (notes.length === 0) {
        notesListEl.innerHTML = `<div class="note-item-sub" style="padding: 14px;">No notes yet. Click ✎ to create one.</div>`;
        return;
      }

      notes.forEach((item) => {
        const div = document.createElement("div");
        div.className = `note-item ${item.id === selectedId ? "active" : ""}`;
        div.innerHTML = `
          <div class="note-item-title">${escapeHtml(item.note || "Untitled Note")}</div>
          <div class="note-item-sub">Note #${item.id}</div>
        `;
        div.addEventListener("click", () => {
          selectedId = item.id;
          noteInputEl.value = item.note;
          deleteBtn.disabled = false;
          statusTextEl.textContent = `Editing Note #${item.id}`;
          renderSidebar();
        });
        notesListEl.appendChild(div);
      });
    }

    async function loadNotes(selectAfterLoad = "first") {
      try {
        const res = await fetch(NOTES_URL, { method: "GET" });
        notes = await res.json();

        if (notes.length > 0) {
          rawNoteDiv.innerHTML = `<p>${escapeHtml(notes[0].note)}</p>`;
        } else {
          rawNoteDiv.innerHTML = "";
        }

        if (selectAfterLoad === "first" && notes.length > 0) {
          selectedId = notes[0].id;
          noteInputEl.value = notes[0].note;
          deleteBtn.disabled = false;
        } else if (selectAfterLoad === "new") {
          selectedId = null;
          noteInputEl.value = "";
          deleteBtn.disabled = true;
        } else if (selectedId !== null) {
          const found = notes.find((n) => n.id === selectedId);
          if (found) {
            noteInputEl.value = found.note;
            deleteBtn.disabled = false;
          } else {
            selectedId = notes[0]?.id ?? null;
            noteInputEl.value = notes[0]?.note ?? "";
            deleteBtn.disabled = selectedId === null;
          }
        } else if (notes.length === 0) {
          selectedId = null;
          noteInputEl.value = "";
          deleteBtn.disabled = true;
        }

        renderSidebar();
      } catch (err) {
        console.error("Error fetching data:", err);
        statusTextEl.textContent = "Cannot connect to http://localhost:3000";
      }
    }

    newNoteBtn.addEventListener("click", () => {
      selectedId = null;
      noteInputEl.value = "";
      noteInputEl.focus();
      deleteBtn.disabled = true;
      statusTextEl.textContent = "New note — click Save to create";
      renderSidebar();
    });

    saveBtn.addEventListener("click", async () => {
      const content = noteInputEl.value.trim();
      if (!content) {
        statusTextEl.textContent = "Note cannot be empty.";
        return;
      }

      try {
        if (selectedId === null) {
          const res = await fetch(BASE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ note: content }),
          });
          const msg = await res.text();
          statusTextEl.textContent = msg;
          await loadNotes("first");
        } else {
          const res = await fetch(BASE_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: selectedId, note: content }),
          });
          const msg = await res.text();
          statusTextEl.textContent = msg;
          await loadNotes("keep");
        }
      } catch (err) {
        console.error("Error saving note:", err);
        statusTextEl.textContent = "Failed to save note.";
      }
    });

    deleteBtn.addEventListener("click", async () => {
      if (selectedId === null) return;

      try {
        const res = await fetch(BASE_URL, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: selectedId }),
        });
        const msg = await res.text();
        statusTextEl.textContent = msg;
        selectedId = null;
        await loadNotes("first");
      } catch (err) {
        console.error("Error deleting note:", err);
        statusTextEl.textContent = "Failed to delete note.";
      }
    });

    loadNotes("first");
  </script>
</body>
</html>
