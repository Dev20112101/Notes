<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>
  <style>
    :root {
      --bg-app: #121214;
      --bg-list: #222226;
      --bg-editor: #18181b;
      --bg-elevated: #2c2c31;
      --bg-hover: rgba(255, 255, 255, 0.06);
      --border: #323238;
      --text-primary: #f5f5f7;
      --text-secondary: #9898a0;
      --accent: #f5b400;
      --accent-hover: #ffca28;
      --accent-text: #141416;
      --danger: #ff453a;
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #09090b;
      color: var(--text-primary);
      font-family: var(--font-apple);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-shell {
      width: 100%;
      max-width: 1000px;
      height: min(680px, calc(100dvh - 32px));
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.75);
    }

    /* Notes List Pane */
    .list-pane {
      background: var(--bg-list);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .list-header {
      padding: 16px 14px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .list-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 1.35rem;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(245, 180, 0, 0.14);
    }

    .search-box {
      padding: 0 14px 12px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 8px 11px;
      color: var(--text-primary);
      font-family: var(--font-apple);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: rgba(245, 180, 0, 0.55);
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 10px;
      -webkit-overflow-scrolling: touch;
    }

    .note-card {
      padding: 12px 13px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .note-card:hover {
      background: var(--bg-hover);
    }

    .note-card.active {
      background: var(--accent);
      color: var(--accent-text);
      border-bottom-color: transparent;
    }

    .note-card-title {
      font-size: 0.94rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .note-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-card.active .note-card-meta {
      color: rgba(20, 20, 22, 0.78);
    }

    .note-card-date {
      flex-shrink: 0;
      font-weight: 500;
    }

    .note-card-preview {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* Note Editor Pane */
    .editor-pane {
      background: var(--bg-editor);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .editor-toolbar {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .back-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: var(--font-apple);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px 4px 0;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 7px 13px;
      font-family: var(--font-apple);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .btn-save {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-save:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-delete {
      background: var(--bg-elevated);
      color: var(--danger);
      border: 1px solid var(--border);
    }

    .btn-delete:hover:not(:disabled) {
      background: rgba(255, 69, 58, 0.14);
    }

    .editor-body {
      flex: 1;
      padding: 14px 22px 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .editor-date {
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      min-height: 1em;
      flex-shrink: 0;
    }

    .note-textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text-primary);
      font-family: var(--font-apple);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .note-textarea::placeholder {
      color: var(--text-secondary);
    }

    .empty-state {
      padding: 24px 14px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Phone & Narrow Split View */
    @media (max-width: 820px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .app-shell {
        display: block;
        position: relative;
        width: 100%;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .list-pane,
      .editor-pane {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-right: none;
        transition: transform 0.22s ease;
      }

      .list-pane {
        z-index: 1;
      }

      .editor-pane {
        z-index: 2;
        transform: translateX(100%);
      }

      .app-shell.mobile-editor-open .editor-pane {
        transform: translateX(0);
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
      }

      .list-header {
        padding: 14px 16px 10px;
      }

      .search-box {
        padding: 0 16px 12px;
      }

      .notes-list {
        padding: 4px 12px 12px;
      }

      .editor-toolbar {
        padding: 10px 14px;
      }

      .editor-body {
        padding: 12px 16px 16px;
      }

      .note-textarea {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Notes List Pane -->
    <section class="list-pane">
      <div class="list-header">
        <h2>Notes</h2>
        <button class="icon-btn" id="new-note-btn" title="New Note">✎</button>
      </div>
      <div class="search-box">
        <input
          type="search"
          class="search-input"
          id="search-input"
          placeholder="Search notes..."
          autocomplete="off"
        />
      </div>
      <div class="notes-list" id="notes-list"></div>
      <div class="list-footer" id="notes-count-footer">0 Notes</div>
    </section>

    <!-- Note Editor Pane -->
    <main class="editor-pane">
      <div class="editor-toolbar">
        <div class="toolbar-left">
          <button class="back-btn" id="back-btn" type="button">‹ Notes</button>
          <span class="status-text" id="status-text">Ready</span>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-delete" id="delete-btn" type="button" disabled>Delete</button>
          <button class="btn btn-save" id="save-btn" type="button">Save</button>
        </div>
      </div>

      <div class="editor-body">
        <div class="editor-date" id="editor-date"></div>
        <textarea
          class="note-textarea"
          id="note-input"
          placeholder="Start typing a note..."
        ></textarea>
      </div>
    </main>
  </div>

  <script>
    const BASE_URL = "http://localhost:3000";
    const NOTES_URL = `${BASE_URL}/notes`;

    const appShellEl = document.getElementById("app-shell");
    const notesListEl = document.getElementById("notes-list");
    const searchInputEl = document.getElementById("search-input");
    const noteInputEl = document.getElementById("note-input");
    const editorDateEl = document.getElementById("editor-date");
    const newNoteBtn = document.getElementById("new-note-btn");
    const backBtn = document.getElementById("back-btn");
    const saveBtn = document.getElementById("save-btn");
    const deleteBtn = document.getElementById("delete-btn");
    const statusTextEl = document.getElementById("status-text");
    const notesCountFooterEl = document.getElementById("notes-count-footer");

    let notes = [];
    let selectedId = null;
    let searchQuery = "";

    function getNoteId(item) {
      return item._id ?? item.id;
    }

    function getNoteText(item) {
      return item.content ?? item.note ?? "";
    }

    function getRawDate(item) {
      return item.date ?? item.updatedAt ?? item.createdAt ?? null;
    }

    function formatShortDate(rawDate) {
      if (!rawDate) return "";
      const date = new Date(rawDate);
      if (Number.isNaN(date.getTime())) return "";

      const now = new Date();
      const isToday =
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate();

      if (isToday) {
        return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const isYesterday =
        date.getFullYear() === yesterday.getFullYear() &&
        date.getMonth() === yesterday.getMonth() &&
        date.getDate() === yesterday.getDate();

      if (isYesterday) return "Yesterday";

      return date.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    function formatFullDate(rawDate) {
      if (!rawDate) return "";
      const date = new Date(rawDate);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString([], {
        month: "long",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function updateEditorDate(item) {
      if (!item) {
        editorDateEl.textContent = formatFullDate(new Date());
        return;
      }
      editorDateEl.textContent = formatFullDate(getRawDate(item));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function openMobileEditor() {
      appShellEl.classList.add("mobile-editor-open");
    }

    function closeMobileEditor() {
      appShellEl.classList.remove("mobile-editor-open");
    }

    function updateCounts() {
      const total = notes.length;
      notesCountFooterEl.textContent = `${total} ${total === 1 ? "Note" : "Notes"}`;
    }

    function renderNotesList() {
      updateCounts();
      notesListEl.innerHTML = "";

      const filtered = notes.filter((item) =>
        getNoteText(item).toLowerCase().includes(searchQuery.trim().toLowerCase())
      );

      if (filtered.length === 0) {
        notesListEl.innerHTML = `
          <div class="empty-state">
            ${searchQuery.trim() ? "No matching notes." : "No notes yet. Tap ✎ to create one."}
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        const id = getNoteId(item);
        const text = getNoteText(item);
        const lines = text.split("\n");
        const title = (lines[0] || "").trim() || "Untitled Note";
        const preview = lines.slice(1).join(" ").trim() || "No additional text";
        const shortDate = formatShortDate(getRawDate(item));

        const card = document.createElement("div");
        card.className = `note-card ${id === selectedId ? "active" : ""}`;
        card.innerHTML = `
          <div class="note-card-title">${escapeHtml(title)}</div>
          <div class="note-card-meta">
            ${shortDate ? `<span class="note-card-date">${escapeHtml(shortDate)}</span>` : ""}
            ${shortDate ? `<span>•</span>` : ""}
            <span class="note-card-preview">${escapeHtml(preview)}</span>
          </div>
        `;

        card.addEventListener("click", () => {
          selectedId = id;
          noteInputEl.value = text;
          deleteBtn.disabled = false;
          statusTextEl.textContent = "Editing note";
          updateEditorDate(item);
          renderNotesList();
          openMobileEditor();
        });

        notesListEl.appendChild(card);
      });
    }

    async function loadNotes(selectAfterLoad = "first") {
      try {
        const res = await fetch(NOTES_URL, { method: "GET" });
        notes = await res.json();

        if (selectAfterLoad === "first" && notes.length > 0) {
          selectedId = getNoteId(notes[0]);
          noteInputEl.value = getNoteText(notes[0]);
          deleteBtn.disabled = false;
          updateEditorDate(notes[0]);
        } else if (selectAfterLoad === "new") {
          selectedId = null;
          noteInputEl.value = "";
          deleteBtn.disabled = true;
          updateEditorDate(null);
        } else if (selectedId !== null) {
          const found = notes.find((n) => getNoteId(n) === selectedId);
          if (found) {
            noteInputEl.value = getNoteText(found);
            deleteBtn.disabled = false;
            updateEditorDate(found);
          } else {
            selectedId = notes[0] ? getNoteId(notes[0]) : null;
            noteInputEl.value = notes[0] ? getNoteText(notes[0]) : "";
            deleteBtn.disabled = selectedId === null;
            updateEditorDate(notes[0] || null);
          }
        } else if (notes.length === 0) {
          selectedId = null;
          noteInputEl.value = "";
          deleteBtn.disabled = true;
          editorDateEl.textContent = "";
        }

        renderNotesList();
      } catch (err) {
        console.error("Error fetching data:", err);
        statusTextEl.textContent = "Cannot connect to server";
      }
    }

    searchInputEl.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderNotesList();
    });

    backBtn.addEventListener("click", () => {
      closeMobileEditor();
    });

    newNoteBtn.addEventListener("click", () => {
      selectedId = null;
      noteInputEl.value = "";
      deleteBtn.disabled = true;
      statusTextEl.textContent = "New note";
      updateEditorDate(null);
      renderNotesList();
      openMobileEditor();
      noteInputEl.focus();
    });

    saveBtn.addEventListener("click", async () => {
      const text = noteInputEl.value.trim();
      if (!text) {
        statusTextEl.textContent = "Note cannot be empty.";
        return;
      }

      try {
        if (selectedId === null) {
          const res = await fetch(BASE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ note: text }),
          });
          const msg = await res.text();
          statusTextEl.textContent = msg;
          await loadNotes("first");
        } else {
          const res = await fetch(BASE_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: selectedId, note: text }),
          });
          const msg = await res.text();
          statusTextEl.textContent = msg;
          await loadNotes("keep");
        }
      } catch (err) {
        console.error("Error saving note:", err);
        statusTextEl.textContent = "Failed to save note.";
      }
    });

    deleteBtn.addEventListener("click", async () => {
      if (selectedId === null) return;

      try {
        const res = await fetch(BASE_URL, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: selectedId }),
        });
        const msg = await res.text();
        statusTextEl.textContent = msg;
        selectedId = null;
        await loadNotes("first");
        closeMobileEditor();
      } catch (err) {
        console.error("Error deleting note:", err);
        statusTextEl.textContent = "Failed to delete note.";
      }
    });

    loadNotes("first");
  </script>
</body>
</html>
